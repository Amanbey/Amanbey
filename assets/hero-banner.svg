<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14"/>
      <stop offset="50%" stop-color="#0E1626"/>
      <stop offset="100%" stop-color="#080C14"/>
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="50%" stop-color="#06D6A0"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <!-- Badge Background Gradient -->
    <linearGradient id="badge-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(16, 185, 129, 0.12)"/>
      <stop offset="100%" stop-color="rgba(56, 189, 248, 0.06)"/>
    </linearGradient>

    <!-- Subtle Radial Glows -->
    <radialGradient id="glow-left" cx="15%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-right" cx="85%" cy="70%" r="45%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.75" stroke-opacity="0.35"/>
      <circle cx="40" cy="40" r="1" fill="#38BDF8" fill-opacity="0.2"/>
    </pattern>
  </defs>

  <style>
    .name-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 46px;
      letter-spacing: -0.5px;
      fill: #FFFFFF;
    }
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 20px;
      letter-spacing: 0.5px;
      fill: #94A3B8;
    }
    .badge-text {
      font-family: 'SF Mono', Monaco, Menlo, 'Courier New', monospace;
      font-weight: 600;
      font-size: 11px;
      letter-spacing: 1.5px;
      fill: #10B981;
      text-transform: uppercase;
    }
    .tagline-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 15px;
      letter-spacing: 0.2px;
      fill: #CBD5E1;
    }
    .pill-text {
      font-family: 'SF Mono', Monaco, Menlo, 'Courier New', monospace;
      font-weight: 500;
      font-size: 11px;
      letter-spacing: 0.5px;
      fill: #E2E8F0;
    }
    .status-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 12px;
      letter-spacing: 0.4px;
      fill: #34D399;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="340" fill="url(#bg-grad)" rx="14"/>
  <rect width="1200" height="340" fill="url(#grid)" rx="14"/>
  <rect width="1200" height="340" fill="url(#glow-left)" rx="14"/>
  <rect width="1200" height="340" fill="url(#glow-right)" rx="14"/>

  <!-- Border Outline -->
  <rect x="1" y="1" width="1198" height="338" fill="none" stroke="#1E293B" stroke-width="1.5" rx="14"/>

  <!-- Top Accent Bar -->
  <rect x="0" y="0" width="1200" height="3" fill="url(#accent-grad)" rx="1"/>

  <!-- Status Pill (Top Left) -->
  <g transform="translate(60, 42)">
    <rect width="280" height="28" rx="14" fill="#0B132B" stroke="#10B981" stroke-width="1" stroke-opacity="0.4"/>
    <circle cx="16" cy="14" r="4.5" fill="#10B981"/>
    <circle cx="16" cy="14" r="8" fill="#10B981" fill-opacity="0.25"/>
    <text x="32" y="18" class="status-text">AVAILABLE FOR REMOTE &amp; CONTRACT</text>
  </g>

  <!-- Terminal / Spec Tag (Top Right) -->
  <g transform="translate(940, 42)">
    <rect width="200" height="28" rx="6" fill="#0B132B" stroke="#334155" stroke-width="1"/>
    <text x="100" y="18" text-anchor="middle" class="badge-text" fill="#38BDF8">SYSTEM ARCHITECT</text>
  </g>

  <!-- Main Headline Group -->
  <g transform="translate(60, 130)">
    <!-- Name -->
    <text x="0" y="0" class="name-text">AMAN ABDELA</text>
    
    <!-- Professional Roles -->
    <text x="0" y="34" class="title-text">
      Software Engineer <tspan fill="#10B981">•</tspan> Full-Stack Developer <tspan fill="#38BDF8">•</tspan> Business Automation Engineer
    </text>

    <!-- Value Statement -->
    <text x="0" y="68" class="tagline-text">
      Building scalable full-stack applications, intelligent multi-agent systems, and real-time architectures.
    </text>
  </g>

  <!-- Bottom Interactive Tech Pills Strip -->
  <g transform="translate(60, 260)">
    <!-- Pill 1: Next.js 15 -->
    <g transform="translate(0, 0)">
      <rect width="105" height="32" rx="6" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
      <text x="52" y="20" text-anchor="middle" class="pill-text">Next.js 15</text>
    </g>

    <!-- Pill 2: React 19 -->
    <g transform="translate(117, 0)">
      <rect width="100" height="32" rx="6" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
      <text x="50" y="20" text-anchor="middle" class="pill-text">React 19</text>
    </g>

    <!-- Pill 3: NestJS / Node -->
    <g transform="translate(229, 0)">
      <rect width="130" height="32" rx="6" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
      <text x="65" y="20" text-anchor="middle" class="pill-text">NestJS • Node</text>
    </g>

    <!-- Pill 4: TypeScript -->
    <g transform="translate(371, 0)">
      <rect width="115" height="32" rx="6" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
      <text x="57" y="20" text-anchor="middle" class="pill-text">TypeScript</text>
    </g>

    <!-- Pill 5: PostgreSQL -->
    <g transform="translate(498, 0)">
      <rect width="115" height="32" rx="6" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
      <text x="57" y="20" text-anchor="middle" class="pill-text">PostgreSQL</text>
    </g>

    <!-- Pill 6: WebSockets -->
    <g transform="translate(625, 0)">
      <rect width="125" height="32" rx="6" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
      <text x="62" y="20" text-anchor="middle" class="pill-text">WebSockets</text>
    </g>

    <!-- Pill 7: Multi-Agent AI -->
    <g transform="translate(762, 0)">
      <rect width="145" height="32" rx="6" fill="#0F172A" stroke="#10B981" stroke-width="1" stroke-opacity="0.5"/>
      <text x="72" y="20" text-anchor="middle" class="pill-text" fill="#34D399">Multi-Agent AI</text>
    </g>

    <!-- Pill 8: IoT & ESP-NOW -->
    <g transform="translate(919, 0)">
      <rect width="160" height="32" rx="6" fill="#0F172A" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.5"/>
      <text x="80" y="20" text-anchor="middle" class="pill-text" fill="#38BDF8">IoT Mesh (ESP32)</text>
    </g>
  </g>
</svg>