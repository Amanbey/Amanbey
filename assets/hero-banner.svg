<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913"/>
      <stop offset="50%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#1e293b" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.5"/>
    </linearGradient>

    <radialGradient id="glow-cyan" cx="15%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glow-purple" cx="85%" cy="75%" r="50%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0"/>
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="tech-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-opacity="0.45"/>
      <circle cx="40" cy="40" r="1" fill="#38bdf8" fill-opacity="0.3"/>
    </pattern>

    <filter id="subtle-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
  </defs>

  <style>
    @keyframes pulse-glow {
      0%, 100% { opacity: 0.8; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.05); }
    }
    @keyframes scanline {
      0% { transform: translateY(-420px); }
      100% { transform: translateY(420px); }
    }
    .pulse-dot {
      animation: pulse-glow 2.5s infinite ease-in-out;
    }
    .font-mono {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    }
    .font-sans {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
  </style>

  <!-- Deep Canvas -->
  <rect width="1200" height="420" rx="16" fill="url(#bg-grad)"/>

  <!-- Glow effects -->
  <circle cx="180" cy="120" r="280" fill="url(#glow-cyan)" filter="url(#subtle-blur)"/>
  <circle cx="1020" cy="300" r="280" fill="url(#glow-purple)" filter="url(#subtle-blur)"/>

  <!-- Grid overlay -->
  <rect width="1200" height="420" rx="16" fill="url(#tech-grid)"/>

  <!-- Border Frame -->
  <rect x="1.5" y="1.5" width="1197" height="417" rx="15" fill="none" stroke="url(#border-grad)" stroke-width="1.5"/>

  <!-- Ambient Code Lines Decorator (Top Right) -->
  <g opacity="0.22" transform="translate(860, 48)">
    <rect width="280" height="150" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <circle cx="18" cy="18" r="4" fill="#ef4444"/>
    <circle cx="32" cy="18" r="4" fill="#eab308"/>
    <circle cx="46" cy="18" r="4" fill="#22c55e"/>
    <text x="18" y="48" fill="#38bdf8" font-size="11" class="font-mono">const developer = {</text>
    <text x="32" y="68" fill="#94a3b8" font-size="11" class="font-mono">name: 'Aman Abdela',</text>
    <text x="32" y="88" fill="#94a3b8" font-size="11" class="font-mono">role: 'Full-Stack Engineer',</text>
    <text x="32" y="108" fill="#94a3b8" font-size="11" class="font-mono">focus: ['Web', 'Real-Time', 'AI'],</text>
    <text x="32" y="128" fill="#a78bfa" font-size="11" class="font-mono">passion: 'Building Impact'</text>
    <text x="18" y="142" fill="#38bdf8" font-size="11" class="font-mono">};</text>
  </g>

  <!-- Status Pill -->
  <g transform="translate(70, 52)">
    <rect width="320" height="34" rx="17" fill="#0c1a33" stroke="#0284c7" stroke-width="1" stroke-opacity="0.8"/>
    <circle cx="18" cy="17" r="4.5" fill="#10b981" class="pulse-dot"/>
    <text x="34" y="22" fill="#38bdf8" font-size="12" font-weight="600" letter-spacing="0.8" class="font-mono">OPEN FOR COLLABORATION &amp; ROLES</text>
  </g>

  <!-- Main Hero Title -->
  <g transform="translate(70, 155)">
    <text x="0" y="0" fill="url(#text-grad)" font-size="52" font-weight="800" letter-spacing="-1.5" class="font-sans">
      Aman Abdela
    </text>
    <text x="350" y="-8" fill="#38bdf8" font-size="34" font-weight="300" class="font-mono">/</text>
    <text x="375" y="-3" fill="#38bdf8" font-size="28" font-weight="600" letter-spacing="0.5" class="font-mono">
      Amanbey
    </text>
  </g>

  <!-- Professional Subtitle -->
  <g transform="translate(70, 202)">
    <text x="0" y="0" fill="url(#accent-cyan)" font-size="21" font-weight="600" letter-spacing="0.2" class="font-sans">
      Full-Stack Software Engineer &amp; Systems Developer
    </text>
    <text x="500" y="-1" fill="#475569" font-size="16" class="font-sans">|</text>
    <text x="515" y="0" fill="#94a3b8" font-size="15" font-weight="500" class="font-sans">
      Software Engineering @ ASTU
    </text>
  </g>

  <!-- Tagline -->
  <g transform="translate(70, 245)">
    <text x="0" y="0" fill="#cbd5e1" font-size="16" font-weight="400" line-height="24" class="font-sans">
      Engineering clean, high-performance web applications, resilient backend architectures,
    </text>
    <text x="0" y="24" fill="#94a3b8" font-size="15" font-weight="400" class="font-sans">
      and real-time interactive experiences that bridge elegant UX with rock-solid engineering.
    </text>
  </g>

  <!-- Tech Stack Chips -->
  <g transform="translate(70, 325)">
    <!-- Chip 1: Next.js -->
    <g transform="translate(0, 0)">
      <rect width="84" height="30" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="42" y="19" fill="#f8fafc" font-size="12" font-weight="600" text-anchor="middle" class="font-mono">Next.js</text>
    </g>
    <!-- Chip 2: React -->
    <g transform="translate(94, 0)">
      <rect width="78" height="30" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="39" y="19" fill="#38bdf8" font-size="12" font-weight="600" text-anchor="middle" class="font-mono">React</text>
    </g>
    <!-- Chip 3: NestJS -->
    <g transform="translate(182, 0)">
      <rect width="84" height="30" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="42" y="19" fill="#f43f5e" font-size="12" font-weight="600" text-anchor="middle" class="font-mono">NestJS</text>
    </g>
    <!-- Chip 4: TypeScript -->
    <g transform="translate(276, 0)">
      <rect width="104" height="30" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="52" y="19" fill="#60a5fa" font-size="12" font-weight="600" text-anchor="middle" class="font-mono">TypeScript</text>
    </g>
    <!-- Chip 5: Node.js -->
    <g transform="translate(390, 0)">
      <rect width="86" height="30" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="43" y="19" fill="#4ade80" font-size="12" font-weight="600" text-anchor="middle" class="font-mono">Node.js</text>
    </g>
    <!-- Chip 6: PostgreSQL -->
    <g transform="translate(486, 0)">
      <rect width="108" height="30" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="54" y="19" fill="#38bdf8" font-size="12" font-weight="600" text-anchor="middle" class="font-mono">PostgreSQL</text>
    </g>
    <!-- Chip 7: MongoDB -->
    <g transform="translate(604, 0)">
      <rect width="96" height="30" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="48" y="19" fill="#34d399" font-size="12" font-weight="600" text-anchor="middle" class="font-mono">MongoDB</text>
    </g>
    <!-- Chip 8: Python -->
    <g transform="translate(710, 0)">
      <rect width="84" height="30" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="42" y="19" fill="#fbbf24" font-size="12" font-weight="600" text-anchor="middle" class="font-mono">Python</text>
    </g>
    <!-- Chip 9: WebSockets -->
    <g transform="translate(804, 0)">
      <rect width="112" height="30" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="56" y="19" fill="#a78bfa" font-size="12" font-weight="600" text-anchor="middle" class="font-mono">WebSockets</text>
    </g>
  </g>

  <!-- Bottom Accent Bar -->
  <rect x="0" y="416" width="1200" height="4" rx="2" fill="url(#accent-cyan)"/>
</svg>
